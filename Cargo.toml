[package]
name = "dd3"
version = "0.1.0"
edition = "2021"
description = "3dd - a 3D Docker visualizer rendered in the terminal via braille"

[[bin]]
name = "dd3"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.47", features = ["full"] }
glam = "0.33"
color-eyre = "0.6"
futures = "0.3"
